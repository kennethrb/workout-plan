<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xtreme Workout Tracker</title>
  <!-- Bootstrap 5 CSS for utility classes -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom Professional Stylesheet -->
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <div class="app-container mt-3">
    <div class="brand-header">
      <h2>💪 Xtreme Progressive Overload</h2>
    </div>
    
    <div id="loading">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Loading your workout data...</p>
    </div>

    <div id="app-content" style="display: none;">
      <!-- Physique Balance Advisor -->
      <div class="balance-box">
        <h6 class="text-success fw-bold mb-1">⚖️ Physique Symmetry Advisor</h6>
        <div id="balanceText" class="small text-light">Analyzing body proportions...</div>
      </div>

      <div class="card shadow-sm">
        <h4 class="mb-3 fs-5">Log Exercise Set</h4>
        <form id="workoutForm">
          <div class="mb-3">
            <label class="form-label">Workout Day Type</label>
            <select class="form-select" id="workoutDay" required>
              <option value="Upper Strength">Upper Strength</option>
              <option value="Lower Strength">Lower Strength</option>
              <option value="Upper Hypertrophy">Upper Hypertrophy</option>
              <option value="Lower Hypertrophy">Lower Hypertrophy</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Exercise</label>
            <select class="form-select" id="exerciseSelect" required></select>
          </div>

          <!-- Progressive Overload Advisor -->
          <div class="advisor-box">
            <h6 class="text-primary fw-bold mb-1">🤖 Overload Advisor</h6>
            <div id="suggestionText" class="mt-2 text-light small">Select an exercise to analyze past performance.</div>
          </div>

          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">Weight Unit</label>
              <select class="form-select" id="weightUnit">
                <option value="Kilogram (kg)">Kilogram (kg)</option>
                <option value="Bodyweight">Bodyweight</option>
              </select>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">Weight Used</label>
              <input type="number" step="0.5" class="form-control" id="weight" required value="0">
            </div>
          </div>

          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">Sets Completed</label>
              <input type="number" class="form-control" id="sets" required value="3">
            </div>
            <div class="col-6 mb-3">
              <label id="repsLabel" class="form-label">Reps per Set</label>
              <input type="text" class="form-control" id="reps" required placeholder="10/10/10">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">RIR (Reps in Reserve)</label>
            <input type="number" class="form-control" id="rir" required value="1" min="0" max="5">
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-bold" id="submitBtn">Log Set & Update Stats</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Custom App Logic Script -->
  <script src="app.js"></script>
</body>
</html>
