<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xtreme Workout Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; padding-bottom: 40px; }
    .card { background-color: #1e1e1e; border: 1px solid #2d2d2d; color: #fff; }
    .form-control, .form-select { background-color: #2b2b2b; color: #fff; border: 1px solid #444; }
    .form-control:focus, .form-select:focus { background-color: #333; color: #fff; border-color: #0d6efd; box-shadow: none; }
    .suggestion-box { background-color: #1f2937; border-left: 4px solid #3b82f6; padding: 12px; border-radius: 4px; margin-bottom: 20px; color: #f3f4f6; }
    .balance-box { background-color: #111827; border-left: 4px solid #10b981; padding: 12px; border-radius: 4px; margin-bottom: 20px; color: #f3f4f6; }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h2 class="text-center mb-4">💪 Xtreme Progressive Overload</h2>
    
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2">Loading workout data & benchmarks...</p>
    </div>

    <div id="app-content" style="display: none;">
      <!-- Physique Balance Advisor -->
      <div class="balance-box" id="balanceBox">
        <h6 class="text-success fw-bold mb-1">⚖️ Upper/Lower Balance Advisor</h6>
        <div id="balanceText" class="small text-light">Analyzing body proportion balance...</div>
      </div>

      <div class="card p-4 shadow-sm mb-4">
        <h4 class="mb-3">Log Exercise Set</h4>
        <form id="workoutForm">
          <div class="mb-3">
            <label class="form-label">Workout Day Type</label>
            <select class="form-select" id="workoutDay" required>
              <option value="Upper Strength">Upper Strength</option>
              <option value="Lower Strength">Lower Strength</option>
              <option value="Upper Hypertrophy">Upper Hypertrophy</option>
              <option value="Lower Hypertrophy">Lower Hypertrophy</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Exercise</label>
            <select class="form-select" id="exerciseSelect" required></select>
          </div>

          <div class="suggestion-box" id="suggestionBox">
            <h6 class="text-primary fw-bold mb-1">🤖 Progressive Overload Advisor</h6>
            <div id="suggestionText" class="mt-2 text-light small">Select an exercise to analyze past performance against your reference goals.</div>
          </div>

          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">Weight Unit</label>
              <select class="form-select" id="weightUnit">
                <option value="Kilogram (kg)">Kilogram (kg)</option>
                <option value="Bodyweight">Bodyweight</option>
              </select>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">Weight Used</label>
              <input type="number" step="0.5" class="form-control" id="weight" required value="0">
            </div>
          </div>

          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">Sets Completed</label>
              <input type="number" class="form-control" id="sets" required value="3">
            </div>
            <div class="col-6 mb-3">
              <label id="repsLabel" class="form-label">Reps per Set (e.g. 10/10/10)</label>
              <input type="text" class="form-control" id="reps" required placeholder="10/10/10">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">RIR (Reps in Reserve)</label>
            <input type="number" class="form-control" id="rir" required value="1" min="0" max="5">
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="submitBtn">Log Set & Update Stats</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxZNsbt0S6EYYqbma4_nRMjNJFt4d-84qt1noBVy97ol2wuuiVZzs8xBSJEn4TRlekj/exec";
    
    let globalData = {};

    window.addEventListener('DOMContentLoaded', function() {
      fetchData();
    });

    function fetchData() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          globalData = data;
          initApp();
        })
        .catch(err => {
          console.error("Error loading data:", err);
          document.getElementById('loading').innerHTML = '<p class="text-danger">Failed to load workout data from backend.</p>';
        });
    }

    function initApp() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';

      document.getElementById('workoutDay').addEventListener('change', updateExerciseDropdown);
      document.getElementById('exerciseSelect').addEventListener('change', function() {
        updateProgressionAdvice();
        checkTimedExercise();
      });

      updateExerciseDropdown();
      evaluatePhysiqueBalance();
    }

    function updateExerciseDropdown() {
      const workoutDay = document.getElementById('workoutDay').value;
      const select = document.getElementById('exerciseSelect');
      select.innerHTML = '';

      let exercisesForDay = (globalData.workoutMap && globalData.workoutMap[workoutDay]) 
                            ? globalData.workoutMap[workoutDay] 
                            : globalData.exercises;

      if (!exercisesForDay || exercisesForDay.length === 0) {
        exercisesForDay = globalData.exercises;
      }

      exercisesForDay.forEach(ex => {
        let opt = document.createElement('option');
        opt.value = ex;
        opt.textContent = ex;
        select.appendChild(opt);
      });

      updateProgressionAdvice();
      checkTimedExercise();
    }

    function checkTimedExercise() {
      const exercise = document.getElementById('exerciseSelect').value.toLowerCase();
      const repsLabel = document.getElementById('repsLabel');
      const repsInput = document.getElementById('reps');

      if (exercise.includes('plank') || exercise.includes('sec') || exercise.includes('hold')) {
        repsLabel.textContent = "Duration per Set in Seconds (e.g. 60/60/60)";
        repsInput.placeholder = "60/60/60";
      } else {
        repsLabel.textContent = "Reps per Set (e.g. 10/10/10)";
        repsInput.placeholder = "10/10/10";
      }
    }

    // JavaScript Logic to check Upper vs Lower balance and prevent "chicken legs"
    function evaluatePhysiqueBalance() {
      const lastLogs = globalData.lastLogs || {};
      let upperWeights = [];
      let lowerWeights = [];

      Object.keys(lastLogs).forEach(ex => {
        let nameLower = ex.toLowerCase();
        let wt = lastLogs[ex].weight || 0;
        if (wt > 0 && lastLogs[ex].weightUnit !== 'Bodyweight') {
          // Categorize based on exercise keywords
          if (nameLower.includes('squat') || nameLower.includes('leg') || nameLower.includes('calf') || nameLower.includes('deadlift') || nameLower.includes('hip') || nameLower.includes('thrust')) {
            lowerWeights.push(wt);
          } else if (nameLower.includes('bench') || nameLower.includes('press') || nameLower.includes('row') || nameLower.includes('pull') || nameLower.includes('curl') || nameLower.includes('extension')) {
            upperWeights.push(wt);
          }
        }
      });

      let avgUpper = upperWeights.length ? upperWeights.reduce((a, b) => a + b, 0) / upperWeights.length : 0;
      let avgLower = lowerWeights.length ? lowerWeights.reduce((a, b) => a + b, 0) / lowerWeights.length : 0;

      const balanceText = document.getElementById('balanceText');
      if (avgUpper === 0 && avgLower === 0) {
        balanceText.innerHTML = "Log some weighted upper and lower exercises to generate your symmetry profile!";
        return;
      }

      let analysis = `<b>Average Working Weights:</b> Upper (~${avgUpper.toFixed(1)} kg) vs Lower (~${avgLower.toFixed(1)} kg)<br>`;
      
      // Proportional ratio heuristic (Lower body compound movements like squats/deadlifts should generally outpace upper body pressing/pulling)
      if (avgLower > 0 && avgUpper > 0 && avgLower < avgUpper * 1.1) {
        analysis += `⚠️ <strong class="text-warning">Warning: Chicken leg risk detected!</strong> Your upper body loading is close to or exceeding your lower body. Prioritize intensity on your <b>Lower Strength</b> days to build balanced proportions.`;
      } else {
        analysis += `✅ <strong class="text-success">Great job!</strong> Your upper and lower body proportions are maintaining a solid strength balance. Keep pushing both!`;
      }

      balanceText.innerHTML = analysis;
    }

    function updateProgressionAdvice() {
      const exercise = document.getElementById('exerciseSelect').value;
      const ref = globalData.references[exercise] || {};
      const last = globalData.lastLogs[exercise] || null;
      
      const box = document.getElementById('suggestionText');
      
      let targetSets = ref.sets || '?';
      let targetReps = ref.repsTarget || '?';
      let targetRir = ref.rirTarget || '1-2';
      let targetWt = ref.weightTarget ? `${ref.weightTarget} kg` : 'N/A';

      let html = `<div class="mb-1 text-info">🎯 <b>Reference Target:</b> ${targetSets} sets × ${targetReps} reps @ RIR ${targetRir} (Target Wt: ${targetWt})</div>`;
      
      if (!last) {
        html += `<div class="text-warning mt-1">No prior logs found for this exercise. Start with your baseline target!</div>`;
      } else {
        let formattedDate = last.date;
        try {
          let d = new Date(last.date);
          if (!isNaN(d)) {
            formattedDate = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }
        } catch (e) {}

        html += `<div class="mb-1">📊 <b>Last Session (${formattedDate}):</b> ${last.weight} ${last.weightUnit === 'Bodyweight' ? '(BW)' : 'kg'}, ${last.sets} sets, Reps/Sec: [${last.reps}], RIR: ${last.rir}</div>`;
        
        let suggestion = "";
        if (last.rir <= 2) {
          suggestion = `🚀 <strong class="text-success">Recommendation: Ready to INCREASE WEIGHT / TIME!</strong> You hit target RIR with solid form. Bump up the intensity next session.`;
        } else if (last.rir > 2) {
          suggestion = `📌 <strong class="text-warning">Recommendation: Hold intensity & Add Reps/Sec.</strong> RIR was high. Keep current weight and aim to lock in clean performance.`;
        } else {
          suggestion = `📈 <strong class="text-info">Recommendation: Progress steadily.</strong> Keep matching your baseline.`;
        }
        html += `<div class="mt-2 text-light">${suggestion}</div>`;
      }
      box.innerHTML = html;
    }

    document.getElementById('workoutForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Saving to Sheet...';

      const payload = {
        workoutDay: document.getElementById('workoutDay').value,
        exercise: document.getElementById('exerciseSelect').value,
        weightUnit: document.getElementById('weightUnit').value,
        weight: parseFloat(document.getElementById('weight').value) || 0,
        sets: parseInt(document.getElementById('sets').value) || 0,
        reps: document.getElementById('reps').value,
        rir: parseInt(document.getElementById('rir').value) || 0
      };

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        fetchData();
        btn.disabled = false;
        btn.textContent = 'Log Set & Update Stats';
      })
      .catch(err => {
        alert("Error saving workout.");
        console.error(err);
        btn.disabled = false;
        btn.textContent = 'Log Set & Update Stats';
      });
    });
  </script>
</body>
</html>
